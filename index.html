<!-- ================= MESSAGE FORM ================= -->

<div class="name-son-two">

  <form action="">

    <div class="form-group">

      <label for="name">
        Name:
      </label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter Your Name"
        required>

    </div>


    <div class="form-group">

      <label for="password">
        Password:
      </label>

      <input
        type="password"
        id="password"
        name="password">

    </div>


    <div class="form-group">

      <label for="email">
        Email:
      </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Example@gmail.com"
        required>

    </div>


    <div class="form-group">

      <label for="number">
        Number:
      </label>

      <input
        type="tel"
        id="number"
        name="number"
        placeholder="Enter your number"
        required>

    </div>


    <div class="form-group">

      <label for="address">
        Address:
      </label>

      <input
        type="text"
        id="address"
        name="address"
        placeholder="Enter your address"
        required>

    </div>


    <div class="form-group">

      <label for="message">
        Message:
      </label>

      <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required></textarea>

    </div>


    <button type="submit" class="submit-btn">
      Send Message
    </button>

  </form>

</div>
